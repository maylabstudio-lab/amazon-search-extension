<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Search Filter</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d292f;
        --muted: #65747a;
        --line: #d7e0e2;
        --paper: #f6f8f5;
        --accent: #e36d2e;
        --accent-dark: #bd4f1b;
      }

      * { box-sizing: border-box; }

      body {
        width: 320px;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      }

      main { padding: 22px; }
      header { margin-bottom: 19px; }
      .eyebrow { margin: 0 0 5px; color: var(--accent-dark); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 22px; line-height: 1.25; }
      .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
      form { display: grid; gap: 15px; }
      label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
      input[type="search"], select { width: 100%; min-height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; font: inherit; font-size: 14px; }
      input:focus, select:focus { border-color: var(--accent); outline: 3px solid #f7d7c5; }
      .options { display: grid; gap: 11px; }
      .check { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); font-size: 13px; font-weight: 500; }
      .check input { width: 16px; height: 16px; accent-color: var(--accent); }
      button { min-height: 44px; border: 0; border-radius: 7px; color: #fff; background: var(--accent); font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
      button:hover { background: var(--accent-dark); }
      button:focus-visible { outline: 3px solid #f0b496; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Quick filter</p>
        <h1>Amazon Search Filter</h1>
        <p class="subtitle">条件を選んで商品を探します。</p>
      </header>

      <form id="search-form">
        <div>
          <label for="keyword">検索キーワード</label>
          <input id="keyword" name="keyword" type="search" placeholder="商品名や型番" autocomplete="off" required autofocus>
        </div>
        <div class="options">
          <label class="check"><input id="amazon-fulfilled" type="checkbox"> Amazonが発送する商品</label>
          <label class="check"><input id="amazon-direct" type="checkbox"> Amazon直販商品</label>
          <div>
            <label for="discount">割引率</label>
            <select id="discount" name="discount">
              <option value="">指定なし</option>
              <option value="10">10%以上</option>
              <option value="20">20%以上</option>
              <option value="30">30%以上</option>
              <option value="40">40%以上</option>
              <option value="50">50%以上</option>
            </select>
          </div>
        </div>
        <button id="search-btn" type="submit">Amazonで検索する</button>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
